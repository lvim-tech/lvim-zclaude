[package]
name = "lvim-zclaude"
version = "0.1.0"
edition = "2021"
authors = ["lvim-tech"]
description = "Claude Code sessions board for zellij: which sessions exist, which one is running, and a jump to the pane it runs in"
license = "BSD-3-Clause"

[dependencies]
# The keyboard layouts (`layout.rs`); a sibling repo until it is published.
lvim-zlayout = { path = "../lvim-zlayout" }
zellij-tile = { git = "https://github.com/zellij-org/zellij", rev = "644d78cecac14ac77d37fe7b9b1eacbedeec1691" }

[profile.release]
lto = true
opt-level = "z"
strip = true
